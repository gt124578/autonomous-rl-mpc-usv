<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1246 424" width="1246" height="424" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1246" height="424" fill="#fcfcfb"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto"><path d="M0,0 L7.4,3.2 L0,6.4 z" fill="#52514e"/></marker><marker id="arf" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto"><path d="M0,0 L7.4,3.2 L0,6.4 z" fill="#8a8983"/></marker></defs>
<text x="28" y="44" font-size="19" font-weight="700" fill="#0b0b0b">Shielded control loop</text>
<text x="28" y="68" font-size="13" fill="#8a8983">One synchronous 10 Hz cycle: observe → infer → filter → actuate</text>
<rect x="28" y="126" width="180" height="118" rx="10" fill="#fcfcfb" stroke="#c9c8c1" stroke-width="1.2"/>
<rect x="28" y="126" width="4" height="118" rx="2" fill="#1baf7a"/>
<text x="46" y="157" font-size="14.5" font-weight="700" fill="#0b0b0b">Sensing</text>
<text x="46" y="180" font-size="12.2" fill="#52514e">3 × 360° LiDAR</text>
<text x="46" y="199" font-size="12.2" fill="#52514e">(water / keel / mast)</text>
<text x="46" y="218" font-size="12.2" fill="#52514e">+ odometry</text>
<rect x="272" y="126" width="150" height="118" rx="10" fill="#fcfcfb" stroke="#c9c8c1" stroke-width="1.2"/>
<rect x="272" y="126" width="4" height="118" rx="2" fill="#52514e"/>
<text x="290" y="157" font-size="14.5" font-weight="700" fill="#0b0b0b">Observation</text>
<text x="290" y="180" font-size="12.2" fill="#52514e">18-D state vector</text>
<rect x="486" y="126" width="168" height="118" rx="10" fill="#fcfcfb" stroke="#c9c8c1" stroke-width="1.2"/>
<rect x="486" y="126" width="4" height="118" rx="2" fill="#2a78d6"/>
<text x="504" y="157" font-size="14.5" font-weight="700" fill="#0b0b0b">PPO policy</text>
<text x="504" y="180" font-size="12.2" fill="#52514e">Stable-Baselines3</text>
<text x="504" y="199" font-size="12.2" fill="#52514e">actor–critic</text>
<rect x="718" y="126" width="246" height="118" rx="10" fill="#fcfcfb" stroke="#c9c8c1" stroke-width="1.2"/>
<rect x="718" y="126" width="4" height="118" rx="2" fill="#008300"/>
<text x="736" y="157" font-size="14.5" font-weight="700" fill="#0b0b0b">MPC safety filter</text>
<text x="736" y="180" font-size="12.2" fill="#52514e">SLSQP quadratic program</text>
<text x="736" y="199" font-size="12.2" fill="#52514e">Fossen 3-DOF prediction</text>
<text x="736" y="218" font-size="12.2" fill="#52514e">H = 2 steps (1 s) · d_safe = 2.0 m</text>
<rect x="1028" y="126" width="190" height="118" rx="10" fill="#fcfcfb" stroke="#c9c8c1" stroke-width="1.2"/>
<rect x="1028" y="126" width="4" height="118" rx="2" fill="#eb6834"/>
<text x="1046" y="157" font-size="14.5" font-weight="700" fill="#0b0b0b">Thrusters</text>
<text x="1046" y="180" font-size="12.2" fill="#52514e">differential PWM</text>
<text x="1046" y="199" font-size="12.2" fill="#52514e">→ Gazebo 11 / VRX</text>
<line x1="214" y1="185.0" x2="264" y2="185.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="428" y1="185.0" x2="478" y2="185.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="454.0" y="175.0" font-size="12" font-style="italic" text-anchor="middle" fill="#52514e">z</text>
<line x1="660" y1="185.0" x2="710" y2="185.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="686.0" y="175.0" font-size="12" font-style="italic" text-anchor="middle" fill="#52514e">u_RL</text>
<line x1="970" y1="185.0" x2="1020" y2="185.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="996.0" y="175.0" font-size="12" font-style="italic" text-anchor="middle" fill="#52514e">u_safe</text>
<path d="M 1123.0 250 L 1123.0 318 L 118.0 318 L 118.0 258" fill="none" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arf)"/>
<text x="620.5" y="309" font-size="12" text-anchor="middle" fill="#8a8983">vessel state fed back through /gazebo/model_states</text>
<text x="841.0" y="96" font-size="12.2" text-anchor="middle" fill="#008300">projects every RL command onto the safe set</text>
<line x1="841.0" y1="104" x2="841.0" y2="120" stroke="#008300" stroke-width="1.2" opacity="0.55"/>
<circle cx="36" cy="370" r="4.5" fill="#d03b3b"/>
<text x="50" y="374" font-size="12.4" fill="#52514e"><tspan fill="#d03b3b" font-weight="700">Emergency reflex</tspan> — inside 2.5 m the filter drops the quadratic program and commands maximum-effort braking, so an infeasible solve can never stall the loop.</text>
</svg>